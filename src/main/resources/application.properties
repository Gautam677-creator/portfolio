# ---- Server (Render injects PORT automatically) ----
spring.application.name=gautam-portfolio
server.port=${PORT:8080}

# ---- Persistence ----
# Embedded H2 keeps the app self-contained. For a managed database, set
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# and add the matching JDBC driver dependency to pom.xml.
spring.datasource.url=jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Observability ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---- CORS (comma separated origin patterns) ----
app.cors.allowed-origins=*

logging.level.com.gautamsingh.portfolio=INFO
